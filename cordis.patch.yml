# dsh-breaker-go 破甲插件 —— bundle 装配层
#
# 0.2.1：**不再覆盖 system-prompt 节点**。
# 覆盖 includeHarnessIdentity / personaPrefix 会在部分宿主上打断装配，
# 表现就是「装上插件后无法对话」。身份剥离交回注入层做，代价只是多几百字节。
#
# 这里只插入自己的运行时节点，且所有拆闸层默认关闭：
# 先用纯注入确认能跑，再按需逐层打开（见 README 的排障一节）。

- insert:
    - id: dsh-breaker-go
      name: 'dsh-breaker-go'
      inject: [systemPrompt]
      config:
        enabled: true
        injectPosition: head
        boost: true
        runtime: false
        restick: false
        postPrompt: ""
